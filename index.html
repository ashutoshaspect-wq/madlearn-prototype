const mindInstances = {};
state.mindmaps = state.mindmaps || {};

/* Resilient adapter: works for both flat mmp API (cedoor v0.2.20) and
   nested map.nodes.* API (TeamMapper fork). */
function mmpApi(map){
  const n = map.nodes || map;           // nested or flat
  const h = map.history || map;         // history namespace varies
  const pick = (obj, ...names)=>{
    for(const name of names){ if(typeof obj[name]==='function') return obj[name].bind(obj); }
    return ()=>{};
  };
  return {
    raw: map,
    addNode:    pick(n, 'addNode'),
    removeNode: pick(n, 'removeNode'),
    selectNode: pick(n, 'selectNode'),
    updateNode: pick(n, 'updateNode'),
    getSelected:pick(n, 'getSelectedNode'),
    copy:       pick(n, 'copyNode'),
    cut:        pick(n, 'cutNode'),
    paste:      pick(n, 'pasteNode'),
    zoomIn:     pick(map, 'zoomIn'),
    zoomOut:    pick(map, 'zoomOut'),
    center:     pick(map, 'center'),
    undo:       pick(h, 'undo'),
    redo:       pick(h, 'redo'),
    on:         (ev,cb)=>{ try{ map.on && map.on(ev,cb); }catch(e){} },
    asJSON:     ()=>{ try{ return (map.exports||map).asJSON?.(); }catch(e){} },
  };
}

function initMindmaps(){
  const nodes = document.querySelectorAll('[data-mindmap]');
  if(!nodes.length) return;
  if(!window.mmp || !window.d3){
    setTimeout(initMindmaps, 80);
    return;
  }
  nodes.forEach(node=>{
    const key = node.getAttribute('data-mindmap');
    const mapId = node.id;

    // If an instance already exists but its DOM element is no longer in the
    // live DOM (accordion was toggled), drop it so we can re-init on this
    // fresh element. This is the root cause of "nodes disappearing after
    // closing and reopening Ideate".
    if(mindInstances[key]){
      const prevEl = mindInstances[key].element;
      if(prevEl && document.contains(prevEl)) return; // still valid
      try { mindInstances[key].map.remove?.(); } catch(e){}
      delete mindInstances[key];
    }

    try {
      const map = window.mmp.create(mapId, {
        centerOnResize: true, drag: true, zoom: true,
        defaultNode: {
          name: 'Subtopic',
          colors:   { name:'#1E2A3B', background:'#FFFFFF', branch:'#577BFC' },
          font:     { size: 11, style:'normal', weight:'normal' },
          locked: false
        },
        rootNode: {
          name: 'My Problem Statement',
          colors: { name:'#1E2A3B', background:'#FFFFFF', branch:'' },
          font:   { size: 12, style:'normal', weight:'600' },
          locked: true   // root cannot be removed
        }
      });

      const api = mmpApi(map);
      const saved = state.mindmaps[key];

      // Branch-thickness coefficient — lower = thinner branches
      const BRANCH_K = 0.3;

      if(saved){
        // Restore user's previous map after accordion toggle
        try { map.new(saved); } catch(e){ console.warn('[mmp] restore failed:', e); map.new(); }
      } else {
        map.new();
        // Seed Solution 1–3 only on first init
        try {
          const root = api.getSelected();
          const rootId = root && root.id;
          const branchColors = ['#24B47E','#EF4444','#2E8BF5'];
          ['Solution 1','Solution 2','Solution 3']
            .forEach((name,i)=>{
              if(rootId) api.selectNode(rootId);
              api.addNode({ name, colors:{ branch: branchColors[i] }, k: BRANCH_K });
            });
          if(rootId) api.selectNode(rootId);
        } catch(e){ console.warn('[mmp] seed failed:', e); }
      }

      // Post-process SVG: mmp paints branches as THICK tapered filled paths.
      // We replace each branch's fill with a thin stroked version — this
      // ignores any internal library settings and guarantees thin branches.
      thinBranches(node);
      const mo = new MutationObserver(()=> thinBranches(node));
      try { mo.observe(node, { childList:true, subtree:true }); } catch(e){}

      try { api.center(); } catch(e){}

      mindInstances[key] = { map, api, element: node };
      wireMmpControls(node.closest('[data-mmp-wrap]'), api);

      // Save on any change + refresh slider to match new selection
      ['nodeUpdate','nodeCreate','nodeRemove','nodeSelect','mmp-node-update','create','remove','update','select']
        .forEach(ev=> api.on(ev, ()=>{
          state.mindmaps[key] = api.asJSON();
          flashSaved(node.closest('[data-mmp-wrap]'));
          syncSliderToSelection(node.closest('[data-mmp-wrap]'), api);
        }));
    } catch(err) {
      console.error('[mmp] init failed:', err);
      node.innerHTML = '<div style="padding:40px;color:#888;text-align:center">Mind map failed to load. Check console.</div>';
    }
  });
}

/**
 * Replace mmp's thick tapered branch fills with a thin stroke.
 *   - Branches are SVG <path> elements that have a fill color set
 *   - Node shapes are <ellipse> / <rect>, not <path>, so they're unaffected
 *   - We keep a "center line" geometry by re-deriving it from the path's
 *     start and end points (using getPointAtLength at 0 and total length)
 *     and draw a smooth cubic curve between them.
 */
function thinBranches(containerEl){
  const svg = containerEl.querySelector('svg');
  if(!svg) return;
  svg.querySelectorAll('path').forEach(p => {
    if(p.dataset.thinned === '1') return;          // already processed
    const fill = p.getAttribute('fill') || getComputedStyle(p).fill;
    if(!fill || fill === 'none' || fill === 'transparent' || fill === 'rgba(0, 0, 0, 0)') return;
    try {
      const len = p.getTotalLength();
      if(!len) return;
      const a = p.getPointAtLength(0);
      const b = p.getPointAtLength(len * 0.5);     // midpoint of the filled shape = curve midpoint
      const c = p.getPointAtLength(len);
      // The filled branch is a closed shape: start == end. Use a quarter/three-quarter sample to get curve ends.
      const start = p.getPointAtLength(len * 0.02);
      const end   = p.getPointAtLength(len * 0.48);
      const cx1 = start.x + (end.x - start.x) * 0.55;
      const cy1 = start.y;
      const cx2 = start.x + (end.x - start.x) * 0.45;
      const cy2 = end.y;
      const newD = `M${start.x},${start.y} C${cx1},${cy1} ${cx2},${cy2} ${end.x},${end.y}`;
      p.setAttribute('d', newD);
      p.setAttribute('stroke', fill);
      p.setAttribute('stroke-width', '2.5');
      p.setAttribute('stroke-linecap', 'round');
      p.setAttribute('fill', 'none');
      p.dataset.thinned = '1';
    } catch(err){ /* path isn't a branch; skip */ }
  });
}

// Slider reflects the selected node's font size (8..28)
function syncSliderToSelection(wrap, api){
  if(!wrap) return;
  const thumb = wrap.querySelector('[data-mmp-thumb]');
  if(!thumb) return;
  try {
    const n = api.getSelected();
    const size = (n && n.font && n.font.size) || 14;
    const pct = Math.max(0, Math.min(100, ((size - 8) / 20) * 100));
    thumb.style.top = (100 - pct) + '%';
  } catch(e){}
}

function flashSaved(wrap){
  if(!wrap) return;
  const el = wrap.querySelector('[data-mmp-saved]');
  if(!el) return;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.style.opacity = '.35'; }, 1200);
}

function wireMmpControls(wrap, api){
  if(!wrap || wrap._wired) return;
  wrap._wired = true;

  const thumb = wrap.querySelector('[data-mmp-thumb]');
  const track = wrap.querySelector('.mmp-slider');
  const safe = fn => { try { fn(); } catch(e){ console.warn('[mmp] action failed:', e); } };
  const readFont = (key) => {
    try { const n = api.getSelected(); return (n && n.font && n.font[key]) || 'normal'; } catch(e){ return 'normal'; }
  };

  // --- Button clicks (add/remove/zoom/center/format) ---
  wrap.addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-mmp-act]');
    if(!btn) return;
    const act = btn.getAttribute('data-mmp-act');

    switch(act){
      case 'add':
        safe(()=> api.addNode());
        break;
      case 'remove': {
        // Protect the root node from deletion
        let sel;
        try { sel = api.getSelected(); } catch(e){}
        if(sel && (sel.isRoot || sel.locked)) return;
        safe(()=> api.removeNode());
        break;
      }
      case 'zoom-in':   safe(()=> api.zoomIn());  break;
      case 'zoom-out':  safe(()=> api.zoomOut()); break;
      case 'center':    safe(()=> api.center());  break;
      case 'bold':
        safe(()=> api.updateNode('fontWeight', readFont('weight') === 'bold' ? 'normal' : 'bold'));
        break;
      case 'italic':
        safe(()=> api.updateNode('fontStyle', readFont('style') === 'italic' ? 'normal' : 'italic'));
        break;
      case 'copy':  safe(api.copy);  break;
      case 'cut':   safe(api.cut);   break;
      case 'paste': safe(api.paste); break;
    }
    flashSaved(wrap);
  });

  // --- Color pickers ---
  wrap.addEventListener('input', (e)=>{
    const input = e.target.closest('[data-mmp-color]');
    if(!input) return;
    const type = input.getAttribute('data-mmp-color');
    const val  = input.value;
    // Reflect chosen color back into the visible dot
    const dot = input.parentElement.querySelector('.mmp-swatch-dot');
    if(dot){
      dot.style.background = val;
      if(val.toLowerCase() === '#ffffff') dot.style.border = '1.5px solid #E5ECF2';
      else dot.style.border = 'none';
    }
    if(type === 'node')   safe(()=> api.updateNode('backgroundColor', val));
    if(type === 'text')   safe(()=> api.updateNode('nameColor',       val));
    if(type === 'branch') safe(()=> api.updateNode('branchColor',     val));
    flashSaved(wrap);
  });

  // --- Slider: resize the selected node (font size 8–28) ---
  if(track && thumb){
    const applyFromClientY = (clientY) => {
      const rect = track.getBoundingClientRect();
      const pct  = Math.max(0, Math.min(100, 100 - ((clientY - rect.top) / rect.height) * 100));
      thumb.style.top = (100 - pct) + '%';
      const size = Math.round(8 + (pct / 100) * 20);
      safe(()=> api.updateNode('fontSize', size));
    };
    const onDown = (e) => {
      e.preventDefault();
      applyFromClientY(e.clientY);
      const onMove = (ev) => applyFromClientY(ev.clientY);
      const onUp   = () => {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup',   onUp);
      };
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup',   onUp);
    };
    track.addEventListener('mousedown', onDown);
  }

  // Initial slider position = root's size
  syncSliderToSelection(wrap, api);
}

render();
</script>
</body>
</html>
